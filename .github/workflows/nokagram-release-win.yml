name: NokaGram Desktop Release (Windows).

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'changelog.txt'
      - 'LEGAL'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:

  windows-release:
    name: Windows x64 Release
    runs-on: windows-latest

    env:
      UPLOAD_ARTIFACT: "true"
      ONLY_CACHE: "false"
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      # Pre-seed git auth for checkout itself: the custom clone path breaks
      # checkout's includeIf credential helper on Windows, so every git
      # invocation (fetch + recursive submodules) rewrites github URLs to
      # carry the token. The secret value is masked in logs automatically.
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: 'url.https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/.insteadOf'
      GIT_CONFIG_VALUE_0: 'https://github.com/'

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-qt-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-x64-qt-

      - name: Libraries.
        run: |
          REM no skip-release: Release link needs breakpad/tg_angle/qt release configs.
          REM silent: auto-rebuild stale cached stages instead of interactive prompt.
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Diagnose prepare failure.
        if: failure()
        shell: cmd
        run: |
          echo === ffnvcodec.pc full content ===
          type %TBUILD%\Libraries\win64\local\lib\pkgconfig\ffnvcodec.pc
          echo === ffnvcodec.pc copies under msys64 ===
          powershell -Command "Get-ChildItem '%TBUILD%\ThirdParty\msys64' -Recurse -Filter 'ffnvcodec.pc' -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }"
          echo === PKG_CONFIG env on runner ===
          set | findstr /I "PKG_CONFIG"
          echo === set env exactly like ffmpeg stage ===
          set PKG_CONFIG_PATH=%TBUILD%\Libraries\win64\local\lib\pkgconfig
          echo === native ucrt64 pkg-config: ffnvcodec ===
          %TBUILD%\ThirdParty\msys64\ucrt64\bin\pkg-config.exe --modversion ffnvcodec
          echo MOD_EXIT=%ERRORLEVEL%
          %TBUILD%\ThirdParty\msys64\ucrt64\bin\pkg-config.exe --exists "ffnvcodec >= 12.1.14.0"
          echo EXISTS_EXIT=%ERRORLEVEL%
          %TBUILD%\ThirdParty\msys64\ucrt64\bin\pkg-config.exe --cflags ffnvcodec
          echo CFLAGS_EXIT=%ERRORLEVEL%
          echo === msys2 bash pkg-config (what configure actually resolves) ===
          bash -c "which -a pkg-config; echo ---; pkg-config --modversion ffnvcodec; echo MSYS_MOD_EXIT=$?; pkg-config --exists 'ffnvcodec >= 12.1.14.0'; echo MSYS_EXISTS_EXIT=$?; pkg-config --cflags ffnvcodec"
          echo === config.log ffnvcodec / nvEncode / dynlink lines ===
          powershell -Command "Select-String -Path %TBUILD%\Libraries\win64\ffmpeg\ffbuild\config.log -Pattern 'ffnvcodec','nvEncode','NV_ENC','dynlink','check_pkg_config','test_pkg_config' | ForEach-Object { $_.Line }"
          exit /b 1

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: NokaGram Desktop build (Release).
        if: env.ONLY_CACHE == 'false'
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          -D TDESKTOP_API_TEST=ON ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_COMPILE_WARNING_AS_ERROR=ON ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ..\out --config Release --parallel

      - name: Move artifact.
        if: (env.UPLOAD_ARTIFACT == 'true')
        run: |
          set OUT=%TBUILD%\%REPO_NAME%\out\Release
          mkdir artifact
          move %OUT%\NokaGram.exe artifact/
          move %OUT%\Updater.exe artifact/
      - uses: actions/upload-artifact@v7
        name: Upload artifact.
        if: (env.UPLOAD_ARTIFACT == 'true')
        with:
          name: NokaGram-Desktop-win64
          path: artifact\
          retention-days: 5
